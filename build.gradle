plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}
tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	manifest {
		attributes(
			"Specification-Title": "NivoratClient",
			"Specification-Version": project.version,
			"Implementation-Title": "NivoratClient",
			"Implementation-Version": project.version
		)
	}
}

boolean isDev = (project.hasProperty("devEdition") && project.property("devEdition").toString().equalsIgnoreCase("true")) ||
		gradle.startParameter.taskNames.any { it.toLowerCase().contains("dev") }

task updateDevConstants {
	doLast {
		def devFile = file("src/main/java/activity/client/presence/NivoratDev.java")
		def devKey = isDev ? "nc_dev_8f29c4a17e0b65d3a912e847c1b50d9f" : ""
		devFile.text = """package activity.client.presence;

public final class NivoratDev {

    private NivoratDev() {}

    public static final boolean IS_DEV = ${isDev};
    public static final String DEV_KEY = "${devKey}";
    public static final String PRESENCE_URL = "https://virion.185-56-162-195.sslip.io/api/v1/presence";
    public static final String BADGE_PREFIX = "§d[NC] ";
    public static final String DOT_PREFIX = "§d● ";
}
"""
	}
}

compileJava.dependsOn updateDevConstants

remapJar {
	archiveFileName = isDev ? "NivoratClient-Dev.jar" : "NivoratClient.jar"
	from(zipTree("libs/appleskin-fabric-mc1.21.11-3.0.8.jar")) {
		exclude "META-INF/**"
		exclude "fabric.mod.json"
		exclude "LICENSE*"
		exclude "pack.mcmeta"
	}
}

tasks.register("buildDev") {
	group = "build"
	description = "Assembles Developer Edition NivoratClient-Dev.jar with covert tracking indicators"
	dependsOn "build"
	doLast {
		def devFile = file("src/main/java/activity/client/presence/NivoratDev.java")
		devFile.text = """package activity.client.presence;

public final class NivoratDev {

    private NivoratDev() {}

    public static final boolean IS_DEV = false;
    public static final String DEV_KEY = "";
    public static final String PRESENCE_URL = "https://virion.185-56-162-195.sslip.io/api/v1/presence";
    public static final String BADGE_PREFIX = "§d[NC] ";
    public static final String DOT_PREFIX = "§d● ";
}
"""
	}
}

