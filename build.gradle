plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}
tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	manifest {
		attributes(
			"Specification-Title": "NivoratClient",
			"Specification-Version": project.version,
			"Implementation-Title": "NivoratClient",
			"Implementation-Version": project.version
		)
	}
}

boolean isDev = (project.hasProperty("devEdition") && project.property("devEdition").toString().equalsIgnoreCase("true")) ||
		gradle.startParameter.taskNames.any { it.toLowerCase().contains("dev") }

def editionResourcesDir = layout.buildDirectory.dir("generated/edition-resources")
sourceSets.main.resources.srcDir(editionResourcesDir)
tasks.register("generateEditionResource") {
	inputs.property("devEdition", isDev)
	outputs.dir(editionResourcesDir)
	doLast {
		def marker = editionResourcesDir.get().file("nivorat-edition.txt").asFile
		marker.parentFile.mkdirs()
		marker.text = isDev ? "dev\n" : "public\n"
	}
}
processResources.dependsOn("generateEditionResource")

remapJar {
	archiveFileName = isDev ? "NivoratClient-Dev.jar" : "NivoratClient.jar"
}

tasks.register("buildDev") {
	group = "build"
	description = "Assembles Developer Edition without embedding credentials"
	dependsOn "build"
}
